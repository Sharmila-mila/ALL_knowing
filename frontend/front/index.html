    async function fetchHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        if (!res.ok) throw new Error();
        return await res.json();
      } catch (err) {
        return { status: 'offline', supabase_connected: false };
      }

      const base = 'inline-flex items-center justify-center font-medium transition-all duration-200 focus:outline-none rounded-2xl active:scale-[0.98]';
      const variants = {
        primary: 'bg-[#0EA5E9] hover:bg-[#0284C7] text-white shadow-sm hover:shadow-md',
        secondary: 'bg-[#F8FAFC] hover:bg-slate-100 text-[#111827] border border-[#E5E7EB]',
        outline: 'bg-transparent border border-[#E5E7EB] hover:border-slate-300 text-[#111827] hover:bg-slate-50',
        ghost: 'bg-transparent hover:bg-slate-100 text-[#6B7280] hover:text-[#111827]',
      };
      const sizes = {
        sm: 'text-xs px-3 py-1.5 gap-1.5',
        md: 'text-sm px-4 py-2.5 gap-2',
        lg: 'text-base px-6 py-3.5 gap-2.5',
      };
      return (
        <button className={`${base} ${variants[variant] || variants.primary} ${sizes[size] || sizes.md} ${className}`} onClick={onClick} disabled={disabled || loading}>
          {loading ? <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-1" /> : null}
          {children}
        </button>
      );
    }

        <span className={`inline-flex items-center gap-1 font-medium rounded-full text-xs px-3 py-1 ${variants[variant] || variants.primary}`}>

    const cleanEmail = (raw) => {
      if (!raw) return null;
      const s = String(raw).trim();
      if (!s) return null;
      if (
        /@company\.com$/i.test(s) ||
        s.toLowerCase().includes('company.com') ||
        s.toLowerCase().includes('example.com') ||
        s.toLowerCase().includes('domain.com') ||
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)
      ) {
        return null;
      }
      return s;
    };

    const formatPhone = (raw) => {
      if (!raw) return null;
      const s = String(raw).trim();
      if (!s || /company\.com/i.test(s) || /incomplete/i.test(s)) return null;

      const digits = s.replace(/\D/g, '');
      if (digits.length < 10 || digits.length > 15) return null;

      const hasPlus = s.startsWith('+');

      if (hasPlus && digits.startsWith('91') && digits.length === 12) {
        return `+91 ${digits.slice(2, 7)} ${digits.slice(7)}`;
      }
      if (!hasPlus && digits.length === 10 && /^[6-9]/.test(digits)) {
        return `+91 ${digits.slice(0, 5)} ${digits.slice(5)}`;
      }

      if (hasPlus && digits.startsWith('1') && digits.length === 11) {
        return `+1 ${digits.slice(1, 4)} ${digits.slice(4, 7)} ${digits.slice(7)}`;
      }
      if (!hasPlus && digits.length === 10) {
        return `+1 ${digits.slice(0, 3)} ${digits.slice(3, 6)} ${digits.slice(6)}`;
      }

      if (hasPlus) {
        if (digits.length > 10) {
          const ccLen = digits.length - 10;
          return `+${digits.slice(0, ccLen)} ${digits.slice(ccLen, ccLen + 5)} ${digits.slice(ccLen + 5)}`;
        }
        return `+${digits}`;
      }

      return `+${digits.slice(0, digits.length - 10)} ${digits.slice(digits.length - 10, digits.length - 5)} ${digits.slice(digits.length - 5)}`;
    };

    const cleanLinkedIn = (raw) => {
      if (!raw) return null;
      const s = String(raw).trim();
      if (!s || s === '#' || !s.toLowerCase().includes('linkedin.com')) return null;

      const cleanDisplay = s
        .replace(/^https?:\/\//i, '')
        .replace(/^www\./i, '')
        .replace(/\/$/, '')
        .split('?')[0];

      const fullUrl = /^https?:\/\//i.test(s) ? s : `https://${s}`;
      return { display: cleanDisplay, href: fullUrl };
    };

    const ensureUrl = (raw) => {
      if (!raw) return null;
      let s = String(raw).trim();
      if (!s || s === '#' || s.toLowerCase() === 'null') return null;
      if (!/^https?:\/\//i.test(s)) s = `https://${s}`;
      return s;
    };

                      </Card>
                      <Card hoverable className="cursor-pointer space-y-2" onClick={() => openCompanyDossier('nvidia')}>
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-2xl bg-[#0EA5E9] text-white font-bold flex items-center justify-center">JH</div>
                          <div>
                            <h3 className="font-bold text-[#111827]">Jensen Huang</h3>
                            <p className="text-xs text-[#6B7280]">Founder & CEO @ Nvidia</p>
                          </div>
                        </div>
                        <p className="text-xs text-[#0EA5E9] font-bold">Open Company Dossier →</p>
                      </Card>
                    </div>
                  </div>
                </div>
              )}

              {tab === 'bookmarks' && (
                <div className="space-y-8 max-w-5xl mx-auto">
                  <div className="flex items-center justify-between">
                    <div>
                      <h1 className="text-2xl font-extrabold text-[#111827]">Bookmarked Portfolio</h1>
                      <p className="text-sm text-[#6B7280] mt-1">Manage saved company profiles. Click any card to view dossier or unmark.</p>
                    </div>
                    <Badge variant="primary">{bookmarks.length} Bookmarked</Badge>
                  </div>

                  {bookmarks.length === 0 ? (
                    <Card className="text-center py-16 space-y-4">
                      <div className="w-12 h-12 rounded-full bg-[#F0F9FF] text-[#0EA5E9] flex items-center justify-center text-xl font-bold mx-auto">☆</div>
                      <h3 className="text-lg font-bold text-[#111827]">No Bookmarked Companies</h3>
                      <p className="text-sm text-[#6B7280] max-w-sm mx-auto">You have not bookmarked any company profiles yet. Search for companies and click the bookmark button to save them here.</p>
                      <Button variant="primary" onClick={() => setTab('company')}>Explore Companies</Button>
                    </Card>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {bookmarks.map((bmKey) => {
                        const comp = companies[bmKey] || {
                          key: bmKey,
                          name: bmKey.toUpperCase(),
                          ticker: bmKey.slice(0, 4).toUpperCase(),
                          industry: 'Saved Entity',
                          marketCap: 'N/A',
                          ceo: 'N/A'
                        };
                        return (
                          <Card
                            key={bmKey}
                            hoverable
                            className="space-y-4 border-l-4 border-l-[#0EA5E9] cursor-pointer group"
                            onClick={() => openCompanyDossier(bmKey)}
                          >
                            <div className="flex items-start justify-between">
                              <div>
                                <h3 className="font-bold text-[#111827] group-hover:text-[#0EA5E9] transition-colors">{comp.name}</h3>
                                <p className="text-xs text-[#6B7280] mt-0.5">{comp.industry} • ({comp.ticker})</p>
                              </div>
                              <button
                                title="Unmark / Remove Bookmark"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  toggleBookmark(bmKey);
                                }}
                                className="p-1.5 rounded-xl bg-sky-50 text-[#0EA5E9] hover:bg-red-50 hover:text-red-600 transition-colors"
                              >
                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                                </svg>
                              </button>
                            </div>

                            <div className="grid grid-cols-2 gap-2 text-xs bg-[#F8FAFC] p-3 rounded-xl border border-[#E5E7EB]">
                              <div>
                                <span className="text-[#6B7280] block">Market Cap</span>
                                <span className="font-bold text-[#111827]">{comp.marketCap}</span>
                              </div>
                              <div>
                                <span className="text-[#6B7280] block">CEO</span>
                                <span className="font-bold text-[#111827]">{comp.ceo}</span>
                              </div>
                            </div>

                            <div className="flex items-center justify-between text-xs pt-1">
                              <span className="text-[#0EA5E9] font-bold group-hover:underline flex items-center gap-1">
                                Open Dossier →
                              </span>
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  toggleBookmark(bmKey);
                                }}
                                className="text-xs font-semibold text-red-500 hover:underline"
                              >
                                Unmark
                              </button>
                            </div>
                          </Card>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {tab === 'settings' && (
                <div className="space-y-8 max-w-4xl mx-auto">
                  <h1 className="text-2xl font-extrabold text-[#111827]">System Settings & Status</h1>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <Card><h3 className="font-bold">Flask Server</h3><p className="text-xs text-[#16A34A] font-semibold mt-1">● Operational (localhost:5000)</p></Card>
                    <Card><h3 className="font-bold">Supabase Store</h3><p className="text-xs text-[#6B7280] font-semibold mt-1">Local JSON Fallback Active</p></Card>
                    <Card><h3 className="font-bold">Playwright Engine</h3><p className="text-xs text-[#16A34A] font-semibold mt-1">● Chromium Active</p></Card>
                    <Card><h3 className="font-bold">Groq AI Engine</h3><p className="text-xs text-[#16A34A] font-semibold mt-1">● Model llama-3.3-70b Active</p></Card>
                  </div>
                </div>
              )}

              {/* Workspace Bottom Footer */}
              <footer className="mt-16 pt-6 border-t border-[#E5E7EB] flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-[#6B7280]">
                <div className="flex items-center gap-3">
                  <div className="w-5 h-5 rounded-lg bg-[#0EA5E9] text-white font-bold flex items-center justify-center text-[10px]">LI</div>
                  <span className="font-semibold text-[#111827]">Zuntra Lead Intelligence</span>
                  <span className="text-[#D1D5DB]">•</span>
                  <span>Local Engine Connected to Supabase</span>
                </div>
                <div className="flex items-center gap-5 font-medium">
                  <button onClick={() => setTab('dashboard')} className="hover:text-[#0EA5E9] transition-colors">Dashboard</button>
                  <button onClick={() => setTab('settings')} className="hover:text-[#0EA5E9] transition-colors">System Diagnostics</button>
                  <a href="/api/health" target="_blank" rel="noopener noreferrer" className="hover:text-[#0EA5E9] transition-colors">API Health</a>
                  <button onClick={onReturnHome} className="hover:text-[#0EA5E9] transition-colors">← Return to Landing</button>
                </div>
              </footer>
            </main>
          </div>
        </div>
      );
    }

    function Root() {
      const [view, setView] = useState('landing');
      if (view === 'landing') {
        return (
          <div className="min-h-screen flex flex-col justify-between">
            <div>
              <LandingNavbar onLaunch={() => setView('app')} />
              <LandingHero onLaunch={() => setView('app')} />
              <Features />
              <WhoUsesZuntra />
              <HowItWorks />
              <WhyZuntra />
              <Engineering />
              <About />
              <Blog />
              <LandingCTA onLaunch={() => setView('app')} />
            </div>
            <LandingFooter onLaunch={() => setView('app')} />
          </div>
        );
      }
      return <AppWorkspace onReturnHome={() => setView('landing')} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
