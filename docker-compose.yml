version: '3.8'

services:
  zuntra-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zuntra_lead_intelligence
    ports:
      - "5000:5000"
    env_file:
      - ./not to share/.env
    restart: unless-stopped
    volumes:
      - zuntra_data:/app/not to share
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  zuntra_data:
